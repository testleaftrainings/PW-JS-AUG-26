/* 
Playwright Built-in Fixtures

UI Testing:
- page fixture:
  Creates an isolated browser context and provides a Page object for UI automation.
  
  Example:
  page.goto("https://example.com");

API Testing:
- request fixture:
  Creates an isolated APIRequestContext for making HTTP requests without launching a browser.

  Example:
  request.post("/users", {
    data: { name: "John" }
  });
*/

| UI Testing                  | API Testing                                                            |
| --------------------------- | ---------------------------------------------------------------------- |
| Uses `page` fixture         | Uses `request` fixture                                                 |
| Opens a browser             | No browser is launched                                                 |
| Interacts with web elements | Sends HTTP requests directly                                           |
| `page.goto()`               | `request.get()`, `request.post()`, `request.put()`, `request.delete()` |


