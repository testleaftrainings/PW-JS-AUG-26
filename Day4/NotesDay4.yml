CallBack function :

⭐ The most important point

When you write:

playVideo(adv, showRelatedVideos);

you are not executing adv or showRelatedVideos.

You are passing their function references.

That's why we use:

adv

instead of:

adv()
Difference
playVideo(adv, showRelatedVideos);

means:

"Give these two functions to playVideo."

Whereas:

playVideo(adv(), showRelatedVideos());

means:

"Execute these functions first, and pass their return values to playVideo."

That's a very important distinction when learning callback functions in JavaScript/TypeScript.

