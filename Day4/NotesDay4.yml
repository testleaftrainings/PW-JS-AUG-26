Develop and Execute a Script :

In playwright we have to write all the test script(develop) with extension .spec.ts under "tests" folder.


Three levels of execution :

1. Through script
2. Terminal
3. Configuration


    headless:true // headless means without UI // if headless is false means with UI


Here the scenario 1 is 

1. set in config
headless:true // without UI

2. set in script 
headles:fasle // with UI


Output:
In the above scenario the script is going to take prioity

Scenario 2 :

When no input is given from script level

1. In config we have set headless : true // without UI

2. In terminal we have set npx playwright test 01-launchBrowser.spec.ts --headed // with UI

Output :
In the above scenario the terminal is going to take prioity


Conclusion on priority:

1. Script
2. Terminal
3. Config
