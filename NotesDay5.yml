Advanced Relative Xpath :
-----------------------

1.a. Parent - Child Relationship (Top to Bottom)

( parent realtive xpath)/(tagName of child) 

//form[@id="login"]/p


1.b. Child - Parent Relationship (Bottom to top) ( Note this traversing from bottom to top is not possible in CSS)

Child relative xpath/parent::parent tagName

//input[@id="username"]/parent::p

------------------------------------

2.a. GrandParent - Child Rleationship (Top to Bottom)

//form[@id="login"]//label

2.b. GrandChild to GrandParent Relationship

GrandChild relative xpath/ancestor::tagName of grand parent

//input[@id="username"]/ancestor::div

------------------------------------

3. Siblings Relationship


3.a.Elder Sibling to Younger Sibling  (Top to bottom)

//label[text()="Username"]/following-sibling::input


3.b. Younger Sibing to Elder Sibling (Bottom to top)


//input[@id="username"]/preceding-sibling::label


4.a.Elder Cosuin  to Younger Cousin  (Top to bottom)

//label[text()="Username"]/following::input


4.b. Younger Cousin to Elder Cousin (Bottom to top)


 //input[@class="decorativeSubmit"]/preceding::input[@id="password"]
