Compare CSS Sibling with Xpath
--------------------------

Immediate Sibling In CSS => "+" in xpath => (Elder sibling relative xpath)/following-sibling::tagName of younger sibling 

Not immediate Sibling (Cousins) In CSS => "~" in xpath => (Elder sibling relative xpath)/following::tagName of younger sibling 








Priority to choose an attribute from a DOM :

1. aria-label
2. id
3. name
4. class

Advanced Relationship based CSS :
--------------------------------


1. Child Combinator (p>input) parent tag > child tag
=> Immediate parent-child relationships


2. Descendant Combinator (ancestorTag childTag) ==> form label 
=> Not directly or immediatlet present parent-child relatiosnhip

3. Adjancent Siblings : Immediate Sibling => meta+link


4. Genaral Siblings : Not necessarily immediates sibling => meta~link
