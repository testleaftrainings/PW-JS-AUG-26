Basic Relative Xpath :

1. Attribute Based Xpath 

Syntax :
//tagname[@attribute='attributeValue’]  /// 

//input[@id='username']


2. Text Based Xpath // We will deal with visible text/ text that is visibile to the user (font colout black)

Syntax :
//tagName[text()='text value in DOM']

//label[text()="Username"]


3. Parital Attribute Based Xpath

We go for parital attribute based Xpath when the attribute value is lengthy

//tagName[contains(@attribute, 'Partial value of the attribute')]

//input[contains(@id, 'user')]


4. Parital Text Based Xpath

We go for parital text based Xpath when the text value is lengthy or has white space

//tagname[contains(text(),' Partial text in my DOM' ')]

//a[contains(text(),'SF')]



5. Collection Based Xpath // Index Based Xpath

(//input[@class="inputLogin"])[2]

