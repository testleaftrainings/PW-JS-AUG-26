1. Handle Browser Location Permission Popup

Best practice:
Grant permission before opening the page.

import { test, expect } from '@playwright/test';

test('Handle popups', async ({ browser }) => {

  // Browser context
  const context = await browser.newContext({
    permissions: ['geolocation'],
    geolocation: {
      latitude: 13.0827,
      longitude: 80.2707
    }
  });

  const page = await context.newPage();

  await page.goto('https://developer.servicenow.com');

/*2. Handle Cookie Policy Popup (Bottom Popup)

