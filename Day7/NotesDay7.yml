Storage State:
--------------
Storage State in Playwright is a saved snapshot of a browser's authenticated session. 
It stores cookies, local storage, and session storage so that we can reuse a logged-in session instead of performing the login steps before every test. 
This makes test execution faster, more reliable, and avoids repeated authentication.


Ways to use storage state in Playwright:

In Playwright, you can configure a **storage state** globally in your `playwright.config.ts` so that all tests start with a logged-in session.

## Option 1: Global storageState (Most Common)

```typescript
// playwright.config.ts

import { defineConfig } from '@playwright/test';

export default defineConfig({
  use: {
    baseURL: 'https://testleaf22-dev-ed.develop.my.salesforce-setup.com/',
    browserName: 'chromium',
    headless: false,

    // Load the saved login session
    storageState: 'Data/login_salesforce.json',
  },
});
```

Now every test automatically uses the login session stored in `playwright/.auth/user.json`.

---

## Step 2: Generate the storage state

Create a setup script.

```typescript
// auth.setup.ts

import { test as setup } from '@playwright/test';

setup('authenticate', async ({ page }) => {
  await page.goto('https://login.salesforce.com/?locale=in');

  await page.fill('#username', 'admin');
  await page.fill('#password', 'password');

  await page.click('button[type="submit"]');

  await page.waitForURL('**/dashboard');

  await page.context().storageState({
    path: 'playwright/.auth/user.json',
  });
});
```

Run it once:

```bash
npx playwright test auth.setup.ts
```

---

## Option 2: Using Playwright Projects (Recommended)

This is the approach recommended by Playwright because the login is regenerated automatically before your tests.

```typescript
import { defineConfig } from '@playwright/test';

export default defineConfig({
  projects: [
    {
      name: 'setup',
      testMatch: /auth\.setup\.ts/,
    },
    {
      name: 'chromium',
      use: {
        storageState: 'playwright/.auth/user.json',
      },
      dependencies: ['setup'],
    },
  ],
});
```

Here:

* `setup` project performs the login.
* It saves `user.json`.
* The `chromium` project waits for `setup` to finish and then uses the saved session.

---

## Option 3: Different storage states for different user roles

```typescript
projects: [
  {
    name: 'admin',
    use: {
      storageState: 'playwright/.auth/admin.json',
    },
  },
  {
    name: 'manager',
    use: {
      storageState: 'playwright/.auth/manager.json',
    },
  },
  {
    name: 'customer',
    use: {
      storageState: 'playwright/.auth/customer.json',
    },
  },
];
```

Then run:

```bash
npx playwright test --project=admin
```

or

```bash
npx playwright test --project=manager
```

---

## Option 4: Override storage state for a specific test

Even if the config has a default storage state, you can override it:

```typescript
import { test } from '@playwright/test';

test.use({
  storageState: 'playwright/.auth/admin.json',
});

test('Admin test', async ({ page }) => {
  await page.goto('/');
});
```

