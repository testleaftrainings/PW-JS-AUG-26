Class and Object:


Real life example of Class and Object, Properties and Methods:

###  What is a *Class*?

A *class* is like a *blueprint* or *template* for creating something.

Example with application login :
-----------------------------------

property :
---------
Represents the information or data related to a particular page or object
(e.g., username, password, URL).

method :
-------- 
Represents the actions or operations performed on that page or object
(e.g., fill a field, click a button, submit a form).

