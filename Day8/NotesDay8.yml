ARRAY DESTRUCTING:
------------------

const [fDown] = await Promise.all([
  page.waitForEvent("download"),
  page.locator('//span[text()="Download"]').click()
]);
Step 1: What does each promise return?
First Promise
page.waitForEvent("download")

Resolves to a Download object.

Download
Second Promise
page.locator('//span[text()="Download"]').click()

The click() method returns:

Promise<void>

It doesn't return the page or the locator. It simply resolves after the click action completes.

Step 2: What does Promise.all() return?

Promise.all() preserves the order of the promises.

So after both finish, it returns:

[
   Download,
   undefined
]

because

waitForEvent() → Download
click() → undefined
Step 3: Array Destructuring

When you write

const [fDown] = ...

it is equivalent to

const result = await Promise.all([
    page.waitForEvent("download"),
    page.locator('//span[text()="Download"]').click()
]);

const fDown = result[0];

So

fDown

contains

Download

The second value (undefined) is simply ignored.

If you wrote
const [fDown, clickResult] = await Promise.all([
    page.waitForEvent("download"),
    page.locator('//span[text()="Download"]').click()
]);

console.log(clickResult);

Output:

undefined
Visual Representation
Promise.all([
   waitForEvent(),     // Download
   click()             // undefined
])

           │
           ▼

[
   Download,
   undefined
]

           │
           ▼

const [fDown] = ...

fDown = Download
Another Example
const [a] = [10, 20];

console.log(a);

Output

10

Similarly,

const [download] = [
    DownloadObject,
    undefined
];

gives

download = DownloadObject

