# Difference Between Interface and Abstract Class

Using the same restaurant example:

### Interface = Rule Book

interface SwiggyRules {

    acceptOrder(): void
    prepareFood(): void

}

Swiggy only says:

> "You must provide these methods."

No implementation.

---

### Abstract Class = Partially Built Restaurant

abstract class Restaurant {

    acceptOrder() {
        console.log("Order Accepted");
    }

    abstract prepareFood(): void;

}


Now Swiggy says:

> "I've already implemented order acceptance for everyone. You only implement food preparation."

---

# Simple Teaching Statement

### Interface

Restaurant Owner gets a rule book.

"These methods must exist."

### Abstract Class

Restaurant Owner gets a half-built restaurant.

Some work is already done.
Remaining work must be completed.

### Class

Finished restaurant ready for customers.

---

Summary :
---

Interface = WHAT should be done

Abstract Class = WHAT + SOME OF HOW

Class = COMPLETE HOW


