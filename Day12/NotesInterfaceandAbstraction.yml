                Restaurant
           -------------------
           acceptOrder()   ✔
           generateBill()  ✔
           prepareFood()   ❌
           -------------------
                abstract
                     ▲
         -------------------------
         |            |          |
         |            |          |
        A2B          KFC      Dominos

 prepareFood()  prepareFood()  prepareFood()

