Browser
A concrete example

Suppose you tell the AI:

"Open Salesforce, enter the username and password, and click Login."

The LLM may reason that it needs browser actions such as:

Navigate → https://login.salesforce.com

Fill → Username textbox

Fill → Password textbox

Click → Login button

Those are exposed as tools/capabilities through the Playwright MCP server.

----------------------------------------------------

| Layer                     | Responsibility                                                   |
| ------------------------- | ---------------------------------------------------------------- |
| **LLM**                   | Understands the user's request and decides what needs to be done |
| **MCP**                   | Standard communication protocol between AI and tools             |
| **Playwright MCP Server** | Makes Playwright browser capabilities available to the AI        |
| **Playwright**            | Performs the actual browser interaction                          |
| **Browser**               | Executes the interaction against the website                     |


