9. Difference between Git Merge and Git Rebase
Answer

Both merge and rebase are used to combine changes from one branch into another, but they do it differently.

Git Merge	Git Rebase
Preserves complete branch history	Rewrites commit history
Creates a new merge commit	No merge commit is created
Easy to understand	Produces a cleaner, linear history
Safe for shared branches	Should not be used on branches already pushed/shared
History looks branched	History looks straight
Example

Suppose we have

main

A ---- B ---- C

feature

      \
       D ---- E
Using Merge
git checkout main
git merge feature

Result

A ---- B ---- C -------- M
      \                /
       D ------------ E

A new Merge Commit (M) is created.

Using Rebase
git checkout feature
git rebase main

Result

A ---- B ---- C ---- D' ---- E'

The commits D and E are replayed on top of main.

When to use Merge?
Team collaboration
Shared branches
Preserve history
Easier to troubleshoot

Example

git checkout main
git merge feature
When to use Rebase?
Before creating a Pull Request
To keep history clean
Personal/local branches

Example

git checkout feature
git rebase main
Interview Answer (1 minute)

Git Merge combines two branches by creating a merge commit, so it preserves the complete branch history. Git Rebase moves the feature branch commits on top of the latest main branch, creating a cleaner linear history without a merge commit. I generally use Merge for shared branches because it is safer, and Rebase for my local feature branches before raising a pull request.


`git fetch` and `git pull` are both used to get changes from a remote repository, but they behave differently.

| Command     | What it does                                                                | Updates your local branch? |
| ----------- | --------------------------------------------------------------------------- | -------------------------- |
| `git fetch` | Downloads the latest commits, branches, and tags from the remote repository | ❌ No                       |
| `git pull`  | Downloads changes **and** merges (or rebases) them into your current branch | ✅ Yes                      |

### 1. `git fetch`

Fetch only downloads the latest changes from the remote repository. It **does not modify your working files or current branch**.

Example:

```bash
git fetch origin
```

Suppose the remote branch has new commits:

```
Remote (origin/main): A -- B -- C
Local (main):         A -- B
```

After `git fetch`:

```
origin/main: A -- B -- C
main:        A -- B
```

Your local `main` is unchanged. You can inspect the new commits before merging:

```bash
git log main..origin/main
git diff main origin/main
```

### 2. `git pull`

Pull is essentially:

```bash
git fetch
git merge
```

(or `git fetch` + `git rebase` if configured).

Example:

```bash
git pull origin main
```

After pulling:

```
Before:
main:        A -- B
origin/main: A -- B -- C

After:
main:        A -- B -- C
```

Your local branch is updated immediately.

### When to use each

* Use **`git fetch`** when you want to:

  * See what others have pushed.
  * Review changes before merging.
  * Keep your local repository updated without affecting your work.

* Use **`git pull`** when you:

  * Want to update your current branch immediately.
  * Are ready to incorporate remote changes into your work.

### Simple analogy

Imagine a shared folder:

* **`git fetch`** = Check for new files and download them to a separate folder without touching your current work.
* **`git pull`** = Download the new files and immediately combine them with your current work.

In practice, many developers prefer:

```bash
git fetch
git status
git log HEAD..origin/main
```

to review incoming changes first, then merge or rebase manually. This gives more control and helps avoid unexpected merge conflicts.


1. git fetch vs git pull

Both get changes from the remote repository, but they behave differently.

git fetch

Downloads the latest changes from remote, but does NOT modify your current branch.

git fetch origin

Suppose:

Remote (GitHub)
A---B---C---D
        ↑
      main

Local
A---B---C
        ↑
      main

After:

git fetch origin

You get:

Remote-tracking branch
A---B---C---D
            ↑
      origin/main

Your local branch
A---B---C
        ↑
      main

Your working code is unchanged.

You can inspect what changed:

git log HEAD..origin/main

Then decide whether you want to merge/rebase.

git pull

pull essentially does:

git fetch
git merge

So:

git pull origin main

downloads the latest changes and integrates them into your current branch.

Example:

Before pull:

Local:  A---B---C
Remote: A---B---C---D---E

After pull:

Local:  A---B---C---D---E
Easy interview answer

git fetch downloads the latest changes from the remote repository without modifying my current branch. git pull downloads the changes and integrates them into my current branch, usually through merge or rebase.

Simple way to remember

Fetch = "Show me what's new."

Pull = "Get what's new and apply it to my branch."

2. What is git stash?

git stash is used when you have uncommitted changes but need to temporarily switch context.

For example, you're working on:

feature/login

and you have modified:

login.spec.ts
user.spec.ts

But suddenly your manager says:

"There's a production issue. Switch to main and fix it."

You can't/don't want to commit your incomplete work yet.

So you can do:

git stash

Git temporarily stores your uncommitted changes and gives you a clean working directory.

Before stash:

login.spec.ts   → modified
user.spec.ts    → modified

After:

git stash
Working directory → clean

Now you can switch branches:

git switch main

Fix the urgent issue, commit it, and later return to your feature branch.

Then restore your previous work:

git stash pop

Your changes come back.

stash workflow

A very common workflow is:

git status

git stash

git switch main

# fix urgent issue

git add .
git commit -m "Fix production issue"

git switch feature/login

git stash pop

Your unfinished work is restored.

3. git stash pop vs git stash apply

This is an important interview question.

git stash apply

Restores the changes but keeps the stash.

git stash apply
Stash
  ↓
Working directory

Stash still exists

You can see it with:

git stash list
git stash pop

Restores the changes and removes that stash if the apply succeeds.

git stash pop
Stash
  ↓
Working directory

Stash removed
Easy memory trick

Apply = use it, keep it

Pop = use it, remove it