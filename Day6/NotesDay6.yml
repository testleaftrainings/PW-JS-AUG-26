Mutiple Dropdown Interaction :
------------------------------

1. Selecting multiple values from a multi-select dropdown

If the HTML is:

<select id="skills" multiple>
  <option value="java">Java</option>
  <option value="python">Python</option>
  <option value="playwright">Playwright</option>
</select>

You can select multiple options in one statement:

await page.locator('#skills').selectOption([
  'java',
  'python',
  'playwright'
]);

You can also use:

await page.locator('#skills').selectOption([
  { label: 'Java' },
  { label: 'Python' }
]);

----------

3. Multiple custom dropdowns

This is very common in real applications. For example:

Country       [India ▼]
State         [Tamil Nadu ▼]
City          [Chennai ▼]

These may not be <select> elements. They could be <div>, <button>, <li>, etc.

Example:

await page.getByRole('combobox', { name: 'Country' }).click();
await page.getByRole('option', { name: 'India' }).click();

await page.getByRole('combobox', { name: 'State' }).click();
await page.getByRole('option', { name: 'Tamil Nadu' }).click();

await page.getByRole('combobox', { name: 'City' }).click();
await page.getByRole('option', { name: 'Chennai' }).click();

The important point is that you cannot blindly use selectOption() for custom dropdowns. selectOption() works with a native HTML <select>.

------------------

4. Handling many dropdowns using a loop

If you have several native dropdowns:

const dropdowns = page.locator('select');

const values = ['India', 'Tamil Nadu', 'Chennai'];

for (let i = 0; i < values.length; i++) {
    await dropdowns.nth(i).selectOption(values[i]);
}

Or, if each dropdown has a different locator:

const dropdowns = [
    { locator: '#country', value: 'India' },
    { locator: '#state', value: 'Tamil Nadu' },
    { locator: '#city', value: 'Chennai' }
];

for (const dropdown of dropdowns) {
    await page.locator(dropdown.locator)
               .selectOption({ label: dropdown.value });
}

